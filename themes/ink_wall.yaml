# Ink Wall: a strictly monochrome theme for e-paper and e-ink wall displays, with light and dark mode in one theme.
#
# Black ink on paper grey, every grey on one of the 16 levels of an e-ink panel (steps of 0x11), no hue anywhere:
# every state colour of Home Assistant (lights, heating, alarms, locks, weather, energy) is mapped to a grey, so the
# dashboard reads the same on a greyscale panel as on a colour screen.
# Square corners, 2 px rules, no shadows, no blur, no motion.
# Dark mode is light ink on dark grey, derived separately rather than inverted.
#
# Works without any add-on: colours, rules, corners, fonts and the disabled animations come from plain theme
# variables. With card-mod 4.x installed (optional), the card-mod-* keys below turn tiles of switched-on devices
# into solid ink tiles with paper text, give unavailable entities a dashed rule, set big numbers in the book serif, mark the selected sidebar entry
# as an ink bar and give the sidebar the theme fonts. Without card-mod those keys are ignored.
#
# Fonts: system fonts only, nothing is downloaded. Numbers and titles use Charter (made for low-resolution
# printers) on Apple devices, Palatino or Cambria on Windows, Noto Serif or DejaVu Serif on Android and Linux.
# Labels use Helvetica Neue, Arial or a metric-compatible sans.
Ink Wall:
  card-mod-theme: Ink Wall

  # Theme-own variables, used below and by the card-mod rules
  ink-wall-ink: "#111111"
  ink-wall-paper: "#eeeeee"
  ink-wall-serif: "Charter, 'Bitstream Charter', 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Cambria, 'Noto Serif', 'DejaVu Serif', Georgia, serif"
  ink-wall-sans: "'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Noto Sans', sans-serif"

  # Core colours: ink for actions and selection
  primary-color: "#111111"
  accent-color: "#111111"
  text-primary-color: "#eeeeee"
  primary-text-color: "#111111"
  secondary-text-color: "#444444"
  disabled-text-color: "#777777"
  disabled-color: "#777777"
  dark-primary-color: "#000000"
  light-primary-color: "#cccccc"
  # Newer frontends build buttons, chips, switches, alerts and borders from these scales.
  # All five are the same grey ramp, so nothing on screen carries a hue.
  ha-color-primary-05: "#000000"
  ha-color-primary-10: "#111111"
  ha-color-primary-20: "#111111"
  ha-color-primary-30: "#222222"
  ha-color-primary-40: "#222222"
