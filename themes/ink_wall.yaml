  # Cards: paper with a 2 px ink rule, square, flat
  card-background-color: "#eeeeee"
  ha-card-background: "#eeeeee"
  ha-card-border-color: "#111111"
  ha-card-border-width: "2px"
  ha-card-border-radius: "0"
  ha-card-box-shadow: "none"
  divider-color: "#777777"
  ha-color-border-neutral-quiet: "#777777"
  outline-color: "#111111"
  outline-hover-color: "#111111"
  # Paper between cards: 12 px keeps two 2 px rules apart on a low-resolution panel
  ha-section-grid-row-gap: "12px"
  ha-section-grid-column-gap: "12px"

  # Square corners everywhere; switches and round icons keep their shape (fixed in the frontend)
  ha-border-radius-sm: "0"
  ha-border-radius-md: "0"
  ha-border-radius-lg: "0"
  ha-border-radius-xl: "0"
  ha-border-radius-2xl: "0"
  ha-border-radius-3xl: "0"
  ha-border-radius-4xl: "0"
  ha-border-radius-6xl: "0"
  ha-border-radius-pill: "0"
  ha-tile-icon-border-radius: "0"
  ha-badge-border-radius: "0"
  control-slider-border-radius: "0"
  control-button-border-radius: "0"
  feature-border-radius: "0"
  ha-dialog-border-radius: "0"
  mdc-shape-small: "0"
  mdc-shape-medium: "0"
  mdc-shape-large: "0"

  # No shadows, no motion
  ha-box-shadow-s: "none"
  ha-box-shadow-m: "none"
  ha-box-shadow-l: "none"
  dialog-box-shadow: "none"
  ha-tooltip-box-shadow: "none"
  ha-animation-duration-instant: "1ms"
  ha-animation-duration-fast: "1ms"
  ha-animation-duration-normal: "1ms"
  ha-animation-duration-slow: "1ms"
  ha-ripple-hover-opacity: "0"
  ha-ripple-pressed-opacity: "0"

  # Dialogs
  ha-dialog-surface-background: "#eeeeee"
  mdc-theme-surface: "#eeeeee"
  mdc-dialog-scrim-color: "rgba(20,20,20,.45)"
  paper-dialog-background-color: "#eeeeee"

  # Header and sidebar
  app-header-background-color: "#dddddd"
  app-header-text-color: "#111111"
  app-header-border-bottom: "2px solid #111111"
  sidebar-background-color: "#dddddd"
  sidebar-text-color: "#111111"
  sidebar-icon-color: "#111111"
  sidebar-selected-text-color: "#111111"
  sidebar-selected-icon-color: "#111111"
  sidebar-menu-button-text-color: "#111111"

  # Inputs and forms
  input-fill-color: "#eeeeee"
  input-ink-color: "#111111"
  input-label-ink-color: "#444444"
  input-idle-line-color: "#111111"
  input-hover-line-color: "#111111"
  input-outlined-idle-border-color: "#111111"
  input-outlined-hover-border-color: "#111111"
  input-disabled-ink-color: "#777777"
  input-disabled-line-color: "#777777"
  input-dropdown-icon-color: "#111111"
  mdc-text-field-fill-color: "#eeeeee"
  mdc-select-fill-color: "#eeeeee"
  ha-color-form-background: "#eeeeee"
  code-editor-background-color: "#eeeeee"
  markdown-code-background-color: "#dddddd"
  switch-checked-button-color: "#eeeeee"
  switch-checked-track-color: "#111111"
  switch-unchecked-button-color: "#111111"
  switch-unchecked-track-color: "#cccccc"
  scrollbar-thumb-color: "#777777"

  # Sliders and rings in ink
  control-slider-color: "#111111"
  control-slider-background: "#888888"
  control-slider-background-opacity: "1"
  control-circular-slider-color: "#111111"
  control-circular-slider-background: "#111111"
  control-circular-slider-background-opacity: ".2"
  control-switch-on-color: "#111111"
  control-switch-off-color: "#cccccc"

  # Typography: a book serif for titles and numbers, a plain sans for labels
  ha-font-family-body: "var(--ink-wall-sans)"
  ha-font-family-heading: "var(--ink-wall-serif)"
  ha-card-header-font-family: "var(--ink-wall-serif)"
  ha-heading-card-title-font-size: "20px"
  # Tiles read from across the room: the state is as large as the name, not a small caption
  ha-tile-info-primary-letter-spacing: "0"
  ha-tile-info-secondary-font-size: "14px"
  ha-tile-info-secondary-line-height: "20px"
  ha-tile-info-secondary-font-weight: "400"
  ha-tile-info-secondary-letter-spacing: "0"
  ha-font-family-code: "ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
  code-font-family: "ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"

  # States: on, heating, lit, alarm and other strong states are ink; calm states mid grey; off is light grey.
  # The palette below feeds every state colour of the frontend, so nothing falls back to a hue.
  state-icon-color: "#111111"
  state-active-color: "#111111"
  state-inactive-color: "#777777"
  state-unavailable-color: "#777777"
  state-icon-error-color: "#111111"
  # Thermostat ring: heating in ink, cooling in light grey, so the two ranges differ without colour
  state-climate-heat-color: "#111111"
  state-climate-cool-color: "#cccccc"
  success-color: "#111111"
  warning-color: "#111111"
  error-color: "#111111"
  info-color: "#111111"
  red-color: "#111111"
  pink-color: "#111111"
  deep-orange-color: "#111111"
  orange-color: "#111111"
  amber-color: "#111111"
  yellow-color: "#111111"
  black-color: "#111111"
  purple-color: "#444444"
  deep-purple-color: "#444444"
  indigo-color: "#444444"
  blue-color: "#444444"
  light-blue-color: "#444444"
  cyan-color: "#444444"
  teal-color: "#444444"
  green-color: "#444444"
  light-green-color: "#444444"
  lime-color: "#444444"
  brown-color: "#444444"
  dark-grey-color: "#444444"
  grey-color: "#777777"
  blue-grey-color: "#777777"
  light-grey-color: "#cccccc"
  white-color: "#eeeeee"
  # Graphs: distinct grey steps
  graph-color-1: "#111111"
  graph-color-2: "#666666"
  graph-color-3: "#aaaaaa"
  graph-color-4: "#333333"
  graph-color-5: "#777777"
  energy-solar-color: "#111111"
  energy-grid-consumption-color: "#666666"
  energy-grid-return-color: "#aaaaaa"
  energy-battery-in-color: "#333333"
  energy-battery-out-color: "#777777"
  energy-non-fossil-color: "#444444"
  energy-gas-color: "#333333"
  energy-water-color: "#666666"
  # Weather icons: ink sun, grey clouds
  weather-icon-sun-color: "#444444"
  weather-icon-moon-color: "#444444"
  weather-icon-rain-color: "#444444"
  weather-icon-cloud-front-color: "#cccccc"
  weather-icon-cloud-back-color: "#666666"

  # Optional, card-mod 4.x: no press ripple on tiles (it flickers on e-paper).
  # A tile prints in reverse (paper on ink) while its device is doing something or needs
  # a look: on, open, unlocked, playing, heating or cooling, cleaning, triggered. Tiles of entities that are
  # unavailable or unknown get a dashed rule, so a dead sensor is visible without colour.
  # Big numbers of entity, sensor, weather and thermostat cards in the book serif.
  card-mod-card: |
    ha-card:has(ha-tile-icon:is([data-state=on], [data-state=open], [data-state=opening], [data-state=closing], [data-state=unlocked], [data-state=unlocking], [data-state=jammed], [data-state=playing], [data-state=heat], [data-state=cool], [data-state=heat_cool], [data-state=auto], [data-state=dry], [data-state=fan_only], [data-state=cleaning], [data-state=returning], [data-state=mowing], [data-state=triggered], [data-state=pending], [data-state=arming])) {
      --ha-card-background: var(--ink-wall-ink);
      background: var(--ink-wall-ink);
      --tile-color: var(--ink-wall-paper) !important;
      --primary-text-color: var(--ink-wall-paper);
      --secondary-text-color: var(--ink-wall-paper);
      --ha-tile-info-primary-color: var(--ink-wall-paper);
      --ha-tile-info-secondary-color: var(--ink-wall-paper);
      --control-slider-background: var(--ink-wall-paper);
      --ha-color-focus: var(--ink-wall-paper);
    }
    ha-tile-container { --ha-ripple-hover-opacity: 0; --ha-ripple-pressed-opacity: 0; }
    ha-card:has(ha-tile-icon:is([data-state=unavailable], [data-state=unknown])) { border-style: dashed; }
    :host(hui-entity-card) .value, :host(hui-weather-forecast-card) .temp, :host(hui-sensor-card) .value { font-family: var(--ink-wall-serif); }
    :host(hui-thermostat-card) ha-state-control-climate-temperature { font-family: var(--ink-wall-serif); }
    :host(hui-heading-card) .title .heading { font-family: var(--ink-wall-serif); font-size: 20px; }
  # Optional, card-mod 4.x: badges have two inks only, full for active and grey for inactive (a light's own colour is dropped)
  card-mod-badge: |
    ha-badge.active { --badge-color: var(--state-icon-color) !important; }
  # Optional, card-mod 4.x: the dashboard title in the book serif
  card-mod-root: |
    .main-title { font-family: var(--ink-wall-serif); font-size: 26px; }
  # Optional, card-mod 4.x: sidebar in the theme fonts, selected entry as a solid ink bar
  card-mod-sidebar: |
    :host { font-family: var(--ink-wall-sans); }
    ha-list-item-button.selected {
      background: var(--ink-wall-ink);
      --sidebar-selected-text-color: var(--ink-wall-paper);
      --sidebar-selected-icon-color: var(--ink-wall-paper);
    }

  modes:
    light: {}
    dark:
      ink-wall-ink: "#eeeeee"
