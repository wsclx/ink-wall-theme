  ha-color-neutral-40: "#222222"
  ha-color-neutral-50: "#444444"
  ha-color-neutral-60: "#666666"
  ha-color-neutral-70: "#777777"
  ha-color-neutral-80: "#cccccc"
  ha-color-neutral-90: "#dddddd"
  ha-color-neutral-95: "#eeeeee"
  ha-color-red-05: "#000000"
  ha-color-red-10: "#111111"
  ha-color-red-20: "#111111"
  ha-color-red-30: "#222222"
  ha-color-red-40: "#222222"
  ha-color-red-50: "#444444"
  ha-color-red-60: "#666666"
  ha-color-red-70: "#777777"
  ha-color-red-80: "#cccccc"
  ha-color-red-90: "#bbbbbb"
  ha-color-red-95: "#cccccc"
  ha-color-orange-05: "#000000"
  ha-color-orange-10: "#111111"
  ha-color-orange-20: "#111111"
